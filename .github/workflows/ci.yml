name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ShaderStudio.slnx

      - name: Build
        run: dotnet build ShaderStudio.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ShaderStudio.slnx -c Release --no-build --logger "console;verbosity=normal"
